<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>FlagRisk Console</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  try {
    var t = localStorage.getItem("fr-console-theme");
    document.documentElement.dataset.theme = t || "light";
  } catch (e) { document.documentElement.dataset.theme = "light"; }
</script>
<style>
  :root {
    /* Brand (light) - from flagrisk.org */
    --paper:#FCFBF8; --white:#FFFFFF;
    --surface:#FFFFFF; --surface-2:#FCFBF8; --surface-3:#F4F1E8;
    --ink:#13160F; --ink-soft:#585D52; --ink-faint:#8A8F82;
    --line:#ECE9DF; --line-2:#DDD9CC;
    --green:#0E6A4F; --green-deep:#0A4A38; --lime:#B7DB1F; --amber:#E8973A; --ember:#D9533F;
    --blue:#DCE9F2; --pink:#F6D9DE; --peach:#FAE0C8; --lav:#E5DEF4; --mint:#D9ECDF; --sky:#E2EEF0;
    --brand:#0E6A4F; --brand-ink:#FFFFFF; --danger:#D9533F;
    --low:#0E6A4F; --moderate:#E8973A; --high:#D9533F; --critical:#A8341F;
    --shadow:0 1px 2px rgba(19,22,15,.04), 0 10px 26px -18px rgba(19,22,15,.18);
    --shadow-lg:0 30px 60px -28px rgba(19,22,15,.40), 0 8px 20px -12px rgba(19,22,15,.22);
    --ease:cubic-bezier(.2,.6,.32,1);
    --r-card:18px; --r-btn:4px; --r-input:8px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    --ui: "General Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  :root[data-theme="dark"] {
    --paper:#10130D; --white:#171B12;
    --surface:#171B12; --surface-2:#1C2117; --surface-3:#262C1F;
    --ink:#F1F0E6; --ink-soft:#A8AD9D; --ink-faint:#787D6F;
    --line:#272D1F; --line-2:#363D2B;
    --green:#3FA77F; --green-deep:#2E8A66; --brand:#3FA77F;
    --blue:#22303a; --pink:#3a2a2d; --peach:#3a3022; --lav:#2e2a3a; --mint:#1f3329; --sky:#22323a;
    --low:#3FA77F; --moderate:#E8973A; --high:#E06A55; --critical:#E06A55;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--ui); font-size: 14px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: var(--ui); cursor: pointer; }
  .mono { font-family: var(--mono); }

  /* ---------- Top bar ---------- */
  .topbar {
    height: 60px; display: flex; align-items: center; gap: 13px;
    padding: 0 22px; border-bottom: 1px solid var(--line);
    background: var(--surface); position: sticky; top: 0; z-index: 10;
  }
  .wordmark { font-weight: 800; letter-spacing: -0.03em; font-size: 18px; color: var(--ink); }
  .tag {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
    color: var(--green); border: 1px solid var(--green); border-radius: 999px; padding: 2px 9px;
  }
  .topbar .spacer { flex: 1; }
  .who { color: var(--ink-soft); font-size: 13px; }
  .btn-ghost {
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--line-2); border-radius: var(--r-btn);
    padding: 8px 13px; font-size: 13px; font-weight: 500;
  }
  .btn-ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
  .btn-ghost.on { color: var(--green); border-color: var(--green); }
  .btn-ghost.icon-btn { padding: 8px 9px; display: inline-flex; align-items: center; }

  /* ---------- Shell + side nav ---------- */
  .app-shell { display: grid; grid-template-columns: 234px 1fr; height: calc(100vh - 60px); }
  .sidenav {
    border-right: 1px solid var(--line); background: var(--surface);
    overflow-y: auto; padding: 16px 13px; display: flex; flex-direction: column; gap: 3px;
  }
  .nav-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-faint); font-weight: 600; padding: 8px 11px 7px;
  }
  .navitem {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent; color: var(--ink-soft);
    border-radius: 11px; padding: 10px 12px; font-size: 14px; font-weight: 500;
    transition: background 0.13s var(--ease), color 0.13s var(--ease);
  }
  .navitem:hover { background: var(--surface-3); color: var(--ink); }
  .navitem.active { background: rgba(14,106,79,0.09); color: var(--green-deep); font-weight: 600; box-shadow: inset 3px 0 0 var(--green); }
  :root[data-theme="dark"] .navitem.active { color: var(--green); background: rgba(63,167,127,0.12); }
  .navitem svg { flex: none; }
  .navitem .nav-count {
    margin-left: auto; font-size: 11px; font-weight: 700; color: #fff;
    background: var(--ember); border-radius: 999px; padding: 1px 8px;
  }
  .navitem .nav-count.zero { background: var(--surface-3); color: var(--ink-faint); }

  .main { overflow: hidden; position: relative; min-width: 0; }
  .section { height: 100%; }
  .section.hidden { display: none !important; }
  .section.pad { padding: 30px 34px 80px; overflow: auto; }
  .section.mod { display: grid; grid-template-columns: 372px 1fr; }
  .section.mod > * { min-width: 0; }

  /* ---------- Panels / headings ---------- */
  .panel { max-width: 1180px; }
  .panel-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .panel-head h1 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -0.035em; }
  .panel-head .sub { color: var(--ink-soft); font-size: 13px; }
  .panel-head .grow { flex: 1; }

  /* ---------- Stat cards (pastel blocks) ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(184px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .stat-card { border: 1px solid rgba(19,22,15,0.05); border-radius: var(--r-card); padding: 17px 19px; }
  .stat-card .n { font-size: 31px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
  .stat-card .l { color: var(--green-deep); font-size: 12px; font-weight: 600; letter-spacing: 0.02em; margin-top: 3px; }
  :root[data-theme="dark"] .stat-card .l { color: var(--ink-soft); }
  .stat-card.p0 { background: var(--blue); } .stat-card.p1 { background: var(--mint); }
  .stat-card.p2 { background: var(--peach); } .stat-card.p3 { background: var(--lav); }
  .stat-card.p4 { background: var(--sky); }  .stat-card.p5 { background: var(--pink); }

  /* ---------- Tables ---------- */
  .data-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; box-shadow: var(--shadow); }
  .data-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); font-weight: 600; padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .data-table td { padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tbody tr.clickable { cursor: pointer; }
  .data-table tbody tr:hover td { background: var(--surface-3); }
  .data-table .num { text-align: right; font-variant-numeric: tabular-nums; }

  .empty { padding: 72px 24px; text-align: center; color: var(--ink-soft); }
  .empty .big { font-size: 17px; color: var(--ink); font-weight: 600; margin-bottom: 5px; letter-spacing: -0.01em; }
  .spin { color: var(--ink-soft); padding: 44px; text-align: center; }

  /* ---------- Cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 15px 18px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); font-weight: 600; }

  /* ---------- Buttons ---------- */
  .btn { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); border-radius: var(--r-btn); padding: 10px 16px; font-size: 13px; font-weight: 600; }
  .btn:hover { border-color: var(--ink-faint); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--green); border-color: var(--green); color: var(--brand-ink); }
  .btn.primary:hover { background: var(--green-deep); border-color: var(--green-deep); }
  .btn.danger { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: rgba(217,83,63,0.10); }

  /* ---------- Pills / chips ---------- */
  .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .pill.ok  { background: rgba(14,106,79,0.12); color: var(--green); }
  .pill.bad { background: rgba(217,83,63,0.13); color: var(--ember); }
  .pill.info{ background: rgba(14,106,79,0.10); color: var(--green-deep); }
  .pill.mut { background: var(--surface-3); color: var(--ink-soft); }
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .filter-chip { font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-soft); background: transparent; text-transform: capitalize; }
  .filter-chip.active { background: var(--green); border-color: var(--green); color: var(--brand-ink); }
  .search-input { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-input); color: var(--ink); padding: 9px 12px; font-size: 13px; font-family: var(--ui); min-width: 230px; }
  .search-input:focus { outline: none; border-color: var(--green); }

  /* ---------- Engine editor ---------- */
  .cfg-group { margin-bottom: 18px; }
  .cfg-row { display: grid; grid-template-columns: 1fr 132px 78px; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .cfg-row:last-child { border-bottom: none; }
  .cfg-key { font-weight: 400; }
  .cfg-key .title { font-weight: 600; }
  .cfg-key code { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); background: var(--surface-3); padding: 1px 6px; border-radius: 5px; margin-left: 6px; }
  .cfg-key .desc { display: block; color: var(--ink-soft); font-size: 12px; font-weight: 400; margin-top: 2px; }
  .cfg-row input { width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-input); color: var(--ink); padding: 8px 10px; font-family: var(--mono); font-size: 13px; }
  .cfg-row input:focus { outline: none; border-color: var(--green); }
  .cfg-row .save { opacity: 0; transition: opacity 0.15s; padding: 8px 0; }
  .cfg-row.dirty .save { opacity: 1; }

  /* ---------- Map ---------- */
  #threatMap { height: 440px; border-radius: var(--r-card); border: 1px solid var(--line); margin-bottom: 24px; background: var(--surface-3); box-shadow: var(--shadow); }
  .leaflet-popup-content { font-family: var(--ui); font-size: 13px; }
  .ana-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .ana-grid .span2 { grid-column: 1 / -1; }
  .chart-wrap { height: 280px; position: relative; }
  .addrow { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .search-pop { position: absolute; top: 40px; right: 0; width: 330px; max-height: 440px; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 44px rgba(0,0,0,0.14); z-index: 60; padding: 6px; }
  .sr-group { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); padding: 8px 10px 4px; }
  .sr-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .sr-item:hover { background: var(--line); }
  .sr-main { font-weight: 600; font-size: 14px; }
  .sr-sub { font-size: 12px; color: var(--ink-soft); }

  /* ---------- Moderation queue ---------- */
  .queue { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
  .queue-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 11px; position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); }
  .queue-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); font-weight: 600; }
  .count-pill { font-size: 12px; font-weight: 700; color: #fff; background: var(--ember); border-radius: 999px; padding: 1px 9px; }
  .count-pill.zero { background: var(--surface-3); color: var(--ink-faint); }
  .qitem { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 0.12s; }
  .qitem:hover { background: var(--surface-3); }
  .qitem.active { background: var(--surface-3); box-shadow: inset 3px 0 0 var(--green); }
  .marker { width: 16px; height: 16px; border-radius: 50%; border: 3px solid var(--ember); margin-top: 3px; }
  .marker.solid { background: var(--ember); }
  .qbody .qcat { font-weight: 600; letter-spacing: -0.01em; text-transform: capitalize; }
  .qbody .qreason { color: var(--ink-soft); font-size: 13px; margin-top: 1px; }
  .qmeta { display: flex; gap: 8px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
  .chip { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--ink-soft); text-transform: capitalize; }
  .chip.status-duplicate { color: var(--amber); border-color: var(--amber); }
  .chip.status-invalid   { color: var(--ember); border-color: var(--ember); }
  .chip.status-flagged   { color: var(--amber); border-color: var(--amber); }
  .chip.state { color: var(--ink-faint); }
  .qtime { color: var(--ink-faint); font-size: 12px; }

  /* ---------- Moderation detail + drawer shared ---------- */
  .detail { overflow-y: auto; padding: 30px 34px 80px; }
  .placeholder { color: var(--ink-faint); padding: 80px 20px; text-align: center; }
  .d-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 22px; }
  .d-head .marker { width: 22px; height: 22px; border-width: 4px; margin-top: 4px; }
  .d-title { font-size: 25px; font-weight: 600; letter-spacing: -0.03em; text-transform: capitalize; }
  .d-sub { color: var(--ink-soft); margin-top: 2px; }
  .reason-banner { border: 1px solid var(--line-2); border-left: 3px solid var(--amber); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 22px; }
  .reason-banner.duplicate { border-left-color: var(--amber); }
  .reason-banner.invalid { border-left-color: var(--ember); }
  .reason-banner .rl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); }
  .reason-banner .rt { margin-top: 3px; }
  video { width: 100%; max-height: 420px; background: #000; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 22px; display: block; }
  .no-video { border: 1px dashed var(--line-2); border-radius: 12px; padding: 28px; text-align: center; color: var(--ink-soft); margin-bottom: 22px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 24px; }
  .grid > * { min-width: 0; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 13px; }
  .kv .k { color: var(--ink-soft); }
  .kv .v { text-align: right; }
  .axis { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .bar { height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; width: 90px; }
  .bar > i { display: block; height: 100%; }
  a.maplink { color: var(--green); text-decoration: none; font-weight: 600; }
  a.maplink:hover { text-decoration: underline; }

  .actions { border-top: 1px solid var(--line); padding-top: 22px; }
  .actions h3 { margin: 0 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); font-weight: 600; }
  textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; color: var(--ink); padding: 10px 12px; font-family: var(--ui); font-size: 13px; margin-bottom: 14px; }
  textarea:focus { outline: none; border-color: var(--green); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .cat-actions { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
  .tscroll { overflow-x: auto; max-width: 100%; }
  .data-table tr.addrow-tr td { border-top: 2px solid var(--line); background: var(--surface-2); vertical-align: middle; }

  /* ---------- Incident drawer ---------- */
  .drawer-wrap { position: fixed; inset: 0; z-index: 1200; }
  .drawer-wrap.hidden { display: none; }
  .drawer-backdrop { position: absolute; inset: 0; background: rgba(19,22,15,0.34); }
  .drawer { position: absolute; top: 0; right: 0; height: 100%; width: min(540px, 95vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); overflow-y: auto; padding: 22px 26px 70px; animation: slidein 0.2s var(--ease); }
  @keyframes slidein { from { transform: translateX(34px); opacity: 0.5; } to { transform: none; opacity: 1; } }
  .drawer-close { float: right; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-btn); color: var(--ink-soft); padding: 7px 12px; font-size: 13px; font-weight: 600; }
  .drawer-close:hover { color: var(--ink); }
  .report-card { border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; margin-bottom: 11px; background: var(--surface-2); }
  .report-card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .report-card .who { font-weight: 600; color: var(--ink); }
  .report-card .desc { color: var(--ink-soft); margin-top: 6px; font-size: 13px; }
  .report-card .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .ai-block { background: rgba(14,106,79,0.06); border: 1px solid rgba(14,106,79,0.18); border-radius: 14px; padding: 13px 15px; margin: 4px 0 22px; }
  .ai-block pre { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; color: var(--ink-soft); margin: 6px 0 0; }

  /* ---------- Login ---------- */
  .login-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: var(--blue); }
  .login { width: 100%; max-width: 372px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 32px; box-shadow: var(--shadow-lg); }
  .login .wordmark { font-size: 23px; margin-bottom: 4px; }
  .login .lead { color: var(--ink-soft); margin-bottom: 22px; font-size: 13px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .field input { width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-input); color: var(--ink); padding: 12px 13px; font-size: 14px; font-family: var(--ui); }
  .field input:focus { outline: none; border-color: var(--green); }
  .login .btn.primary { width: 100%; padding: 13px; margin-top: 6px; font-size: 15px; }
  .login-top { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); border: 1px solid var(--ink); color: var(--paper); padding: 11px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; z-index: 1300; box-shadow: var(--shadow-lg); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  .hidden { display: none !important; }

  @media (max-width: 900px) {
    .app-shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidenav { flex-direction: row; overflow-x: auto; padding: 9px 11px; gap: 6px; border-right: none; border-bottom: 1px solid var(--line); }
    .nav-label { display: none; }
    .navitem { width: auto; white-space: nowrap; }
    .navitem .nav-count { margin-left: 6px; }
    .section.mod { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; }
    .queue { border-right: none; border-bottom: 1px solid var(--line); }
    .ana-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="login">
    <div class="login-top">
      <button class="btn-ghost icon-btn" id="themeBtnLogin" title="Toggle theme"></button>
    </div>
    <div class="wordmark">FlagRisk</div>
    <div class="lead">Operations console. Sign in with your team account.</div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
    </div>

function timeAgo(ts) {
  if (!ts) return "";
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60); if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60); if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

  var acr = { ai: "AI", ngn: "NGN", usd: "USD", sos: "SOS", km: "km", h: "h" };
  var s = k.split("_").map(function (w) { return acr[w] || w; }).join(" ");

}

function logAccess(a, t, d) { try { supabase.rpc("admin_log_access", { p_action: a, p_target: t || null, p_detail: d || null }); } catch (e) {} }
function capsSections() {
  const base = (CAPS && Array.isArray(CAPS.sections)) ? CAPS.sections.slice() : ["moderation"];
  // Beta testing tab is owner/admin-only. The admin_tester_feedback RPC also enforces
  // is_app_admin server-side, so this is presentation only, not the security boundary.

function wireSearch() {

// ---- CSV export ----
function exportCSV(name, rows, cols) {
  const cell = (v) => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = cols.map((c) => c.label).join(",") + "\n" +
    rows.map((r) => cols.map((c) => cell(r[c.key])).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  logAccess("export", name, rows.length + " rows");
}

async function doLogin() {
  const email = $("email").value.trim(), password = $("password").value;

  if (!items.length) { nav.innerHTML = '<div class="nav-label">Operations</div><div style="padding:10px 12px;color:var(--ink-soft);font-size:13px;">No sections are enabled for this account.</div>'; return; }
  nav.innerHTML = '<div class="nav-label">Operations</div>' +
    items.map((s) => '<button class="navitem" data-key="' + s.key + '">' + (ICONS[s.key] || "") + '<span>' + esc(s.label) + '</span>' +
      (s.key === "moderation" ? '<span class="nav-count zero" id="navCount">0</span>' : '') + '</button>').join("") +
    (CAPS && CAPS.role ? '<div class="nav-label" style="margin-top:auto;">Signed in as</div><div style="padding:0 12px 10px;color:var(--ink-soft);font-size:12px;text-transform:capitalize;">' + esc(String(CAPS.role).replace(/_/g, " ")) + '</div>' : '');
  nav.querySelectorAll(".navitem").forEach((el) => el.addEventListener("click", () => navTo(el.dataset.key)));
}
function switchSection(key) {
  if (capsSections().indexOf(key) < 0) return;
  activeSection = key;
  SECTIONS.forEach((s) => { const el = $("sec-" + s.key); if (el) el.classList.toggle("hidden", s.key !== key); });
  document.querySelectorAll(".navitem").forEach((el) => el.classList.toggle("active", el.dataset.key === key));
  const s = SECTIONS.find((x) => x.key === key); if (s) s.load();
}

// ---- Path routing: each section gets its own URL, base auto-detected ----
let BASE = "/";
function detectBase() {
  var keys = SECTIONS.map(function (s) { return s.key; });
  var p = location.pathname || "/";
  var parts = p.split("/");
  var last = parts[parts.length - 1];
  if (keys.indexOf(last) >= 0) { parts.pop(); BASE = parts.join("/") + "/"; }
  else { BASE = (p.charAt(p.length - 1) === "/") ? p : p + "/"; }
  if (BASE.charAt(0) !== "/") BASE = "/" + BASE;
  BASE = BASE.replace(/\/{2,}/g, "/");
}
function currentPathKey() {
  var p = location.pathname || "/";
  var rest = (p.indexOf(BASE) === 0) ? p.slice(BASE.length) : p.replace(/^\/+/, "");
  rest = rest.replace(/\/+$/, "");
  if (!rest && location.hash) rest = location.hash.replace(/^#\/?/, ""); // honor old #hash links
  if (rest.indexOf("/") >= 0) rest = rest.substring(rest.lastIndexOf("/") + 1);
  return decodeURIComponent(rest);
}
function navTo(key) {
  if (currentPathKey() === key) { switchSection(key); return; }
  history.pushState({ key: key }, "", BASE + key);
  switchSection(key);
}
function applyRoute() {
  const allowed = capsSections();
  if (!allowed.length) return;
  let key = currentPathKey();
  if (allowed.indexOf(key) < 0) key = (allowed.indexOf(activeSection) >= 0 ? activeSection : allowed[0]);
  if (location.pathname !== BASE + key) history.replaceState({ key: key }, "", BASE + key);
  switchSection(key);
}
window.addEventListener("popstate", () => {
  if (!(appView && !appView.classList.contains("hidden"))) return;
  const allowed = capsSections();
  let key = currentPathKey();
  if (allowed.indexOf(key) < 0) key = (allowed.indexOf(activeSection) >= 0 ? activeSection : (allowed[0] || "overview"));
  switchSection(key);
});

async function drawThreatMap() {
  const node = $("threatMap"); if (!node || typeof L === "undefined") return;
  if (!mapObj) { mapObj = L.map(node, { zoomControl: true, attributionControl: false }).setView([9.06, 7.49], 6); addBaseTiles(); mapLayer = L.layerGroup().addTo(mapObj); }

  });
  if (pts.length) { try { mapObj.fitBounds(pts, { padding: [40, 40], maxZoom: 13 }); } catch (e) {} }
}

async function apiPost(path, body) {

  const res = await fetch(path, {

let incCache = [], incFilter = "all", incNear = null;
async function loadIncidents() {
  const el = $("sec-incidents");
  el.innerHTML = '<div class="panel-head"><h1>Incidents</h1><span class="sub">Most recent first</span></div><div class="spin">Loading...</div>';
  const params = { p_limit: 200 };
  if (incNear) { params.p_near_lat = incNear.lat; params.p_near_lng = incNear.lng; params.p_sort = "distance"; }
  const { data, error } = await supabase.rpc("admin_incidents", params);
  if (error) { el.innerHTML = '<div class="panel-head"><h1>Incidents</h1></div>' + adminErr(error); return; }
  incCache = data || []; renderIncidents();
}
function sortNearMe() {
  if (!navigator.geolocation) { manualCenter(); return; }
  toast("Getting your location...");
  navigator.geolocation.getCurrentPosition(
    (pos) => { incNear = { lat: pos.coords.latitude, lng: pos.coords.longitude }; loadIncidents(); },
    () => { manualCenter(); },
    { timeout: 8000 }
  );
}
function manualCenter() {
  const ll = prompt("Enter a center as lat,lng to sort incidents by distance:");
  if (!ll) return;
  const parts = ll.split(","), la = parseFloat(parts[0]), lo = parseFloat(parts[1]);
  if (isFinite(la) && isFinite(lo)) { incNear = { lat: la, lng: lo }; loadIncidents(); } else toast("Invalid coordinates");
}
function renderIncidents() {
  const el = $("sec-incidents");
  const statuses = Array.from(new Set(incCache.map((i) => i.status).filter(Boolean)));
  const rows = incCache.filter((i) => incFilter === "all" || i.status === incFilter);
  const chips = ['<button class="filter-chip' + (incFilter === "all" ? " active" : "") + '" data-f="all">All ' + incCache.length + '</button>']
    .concat(statuses.map((s) => '<button class="filter-chip' + (incFilter === s ? " active" : "") + '" data-f="' + esc(s) + '">' + esc(s) + '</button>')).join("");
  const near = !!incNear;

    '<div class="panel-head"><h1>Incidents</h1><span class="sub">' + rows.length + (near ? ' shown, nearest first.' : ' shown. Click a row for detail.') + '</span><span class="grow"></span>' +
    (near ? '<button class="btn-ghost" id="incNearClear">Clear proximity</button>' : '<button class="btn-ghost" id="incNearBtn">Sort near me</button>') +
    '<button class="btn-ghost" id="incCsv">Export CSV</button></div>' +
    '<div class="filter-bar">' + chips + '</div>' +
    '<div class="tscroll"><table class="data-table"><thead><tr><th>Category</th><th>Status</th><th>Severity</th><th class="num">Conf.</th><th class="num">Reports</th>' + (near ? '<th class="num">Distance</th>' : '') + '<th>Last activity</th></tr></thead><tbody>' +
    (rows.length ? rows.map((i) => incRow(i, near)).join("") : '<tr><td colspan="' + (near ? 7 : 6) + '" style="color:var(--ink-soft);">No incidents in this view.</td></tr>') + '</tbody></table></div>';

  el.querySelectorAll("tr.clickable").forEach((tr) => tr.addEventListener("click", () => openIncident(tr.dataset.id)));

  const nc = $("incNearClear"); if (nc) nc.addEventListener("click", () => { incNear = null; loadIncidents(); });
  $("incCsv").addEventListener("click", () => exportCSV("flagrisk-incidents.csv", rows, [
    { key: "category_id", label: "category" }, { key: "status", label: "status" }, { key: "severity_score", label: "severity" },
    { key: "confidence_score", label: "confidence" }, { key: "report_count", label: "reports" }, { key: "distance_km", label: "distance_km" }, { key: "lat", label: "lat" }, { key: "lng", label: "lng" }, { key: "last_activity_at", label: "last_activity" }]));
}
function incRow(i, near) {

let cfgCache = [];
async function loadEngine() {
  const el = $("sec-engine");
  el.innerHTML = '<div class="panel-head"><h1>Engine</h1><span class="sub">Risk and scoring calibration</span></div><div class="spin">Loading...</div>';
  const { data, error } = await supabase.rpc("admin_get_config");
  if (error) { el.innerHTML = '<div class="panel-head"><h1>Engine</h1></div>' + adminErr(error); return; }
  cfgCache = data || []; renderEngine();
}
function cfgGroupOf(k) {
  if (k.indexOf("risk_") === 0) return "Risk score";
  if (k.indexOf("sev_") === 0) return "Severity";
  if (k.indexOf("conf") === 0 || k.indexOf("in_app") === 0 || k.indexOf("push_") === 0) return "Confidence and alerting";
  if (k.indexOf("cred_") === 0 || k.indexOf("established_") === 0) return "Credibility";
  if (k.indexOf("ai_") === 0) return "AI advisory";
  if (k.indexOf("cluster_") === 0) return "Clustering";
  if (k.indexOf("price_") === 0 || k.indexOf("custom_") === 0 || k.indexOf("radius_km_") === 0) return "Pricing and coverage";
  if (k.indexOf("panic_") === 0 || k.indexOf("false_panic") === 0 || k.indexOf("dispute_") === 0) return "Panic and disputes";
  return "Other";
}
function renderEngine() {
  const el = $("sec-engine");
  const groups = {};
  cfgCache.forEach((c) => { const g = cfgGroupOf(c.key); (groups[g] = groups[g] || []).push(c); });
  const order = ["Risk score", "Severity", "Confidence and alerting", "Credibility", "AI advisory", "Clustering", "Panic and disputes", "Pricing and coverage", "Other"];
  let html = '<div class="panel-head"><h1>Engine</h1><span class="sub">' + cfgCache.length + ' keys. Edits apply immediately and are written to config_audit.</span><span class="grow"></span><input class="search-input" id="cfgSearch" placeholder="Filter keys" /></div>';
  order.forEach((g) => { if (!groups[g]) return; html += '<div class="cfg-group"><div class="card"><h3>' + esc(g) + '</h3>' + groups[g].map(cfgRow).join("") + '</div></div>'; });
  el.innerHTML = html;
  el.querySelectorAll(".cfg-row input").forEach((inp) => {
    inp.addEventListener("input", () => inp.closest(".cfg-row").classList.add("dirty"));
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") saveCfg(inp.dataset.key, inp); });
  });
  el.querySelectorAll(".cfg-row .save").forEach((b) => b.addEventListener("click", () => { const row = b.closest(".cfg-row"); saveCfg(b.dataset.key, row.querySelector("input")); }));
  $("cfgSearch").addEventListener("input", (e) => filterEngine(e.target.value));
}
function filterEngine(q) {
  const ql = (q || "").toLowerCase();
  document.querySelectorAll("#sec-engine .cfg-group").forEach((g) => {
    let any = false;
    g.querySelectorAll(".cfg-row").forEach((r) => {
      const show = !ql || (r.dataset.k + " " + r.dataset.d).toLowerCase().indexOf(ql) >= 0;
      r.style.display = show ? "" : "none"; if (show) any = true;
    });
    g.style.display = any ? "" : "none";
  });
}
function cfgRow(c) {
  return '<div class="cfg-row" data-k="' + esc(c.key) + '" data-d="' + esc(c.description || "") + '">' +
    '<div class="cfg-key"><span class="title">' + esc(humanize(c.key)) + '</span> <code>' + esc(c.key) + '</code>' + (c.description ? '<span class="desc">' + esc(c.description) + '</span>' : '') + '</div>' +
    '<input type="number" step="any" value="' + esc(c.value) + '" data-key="' + esc(c.key) + '" />' +
    '<button class="btn primary save" data-key="' + esc(c.key) + '">Save</button></div>';
}
async function saveCfg(key, inp) {
  if (!inp) return;
  const val = parseFloat(inp.value);
  if (isNaN(val)) { toast("Enter a number"); return; }
  const { error } = await supabase.rpc("admin_set_config", { p_key: key, p_value: val });
  if (error) { toast("Save failed: " + error.message); return; }
  const row = inp.closest(".cfg-row"); if (row) row.classList.remove("dirty");
  const c = cfgCache.find((x) => x.key === key); if (c) c.value = val;
  logAccess("engine_change", key, String(val));
  toast(key + " updated");
}

async function recordPayment(id, reason) {

async function createSub(id, reason) {

  const { error } = await supabase.rpc("admin_create_subscription", { p_user: id, p_tier: tier, p_interval: intv, p_currency: curv, p_provider: "manual", p_period_end: null });

async function toggleSuspend(id, val) {

async function togglePanic(id, val) {

async function sendReset(id) {

async function cancelSub(id, reason) {

async function purgeData(id, reason) {

let supportStatus = "", supportSearch = "", supportCache = [];
async function loadSupport() {
  const el = $("sec-support");
  el.innerHTML = '<div class="panel-head"><h1>Support</h1><span class="sub">Tickets from people using the app</span><span class="grow"></span></div>' +
    '<div id="supportKpis" class="stat-grid"></div>' +
    '<div class="filter-bar">' +
    '<input class="search-input" id="supportSearch" placeholder="Search subject, message or name, then Enter" value="' + esc(supportSearch) + '" />' +
    '<select class="search-input" id="supportFilter">' +
    [["", "All, waiting first"], ["open", "Waiting on us"], ["answered", "Answered"], ["resolved", "Resolved"]]
      .map((o) => '<option value="' + o[0] + '"' + (supportStatus === o[0] ? " selected" : "") + '>' + o[1] + '</option>').join("") +
    '</select></div>' +
    '<div id="supportBody"><div class="spin">Loading...</div></div>';
  $("supportSearch").addEventListener("keydown", (e) => { if (e.key === "Enter") { supportSearch = e.target.value.trim(); fetchSupport(); } });
  $("supportFilter").addEventListener("change", (e) => { supportStatus = e.target.value; fetchSupport(); });

}
async function fetchSupport() {
  const body = $("supportBody"); if (!body) return;
  body.innerHTML = '<div class="spin">Loading...</div>';
  const { data, error } = await supabase.rpc("admin_support_list", { p_status: supportStatus || null, p_search: supportSearch || null, p_limit: 200 });
  if (error) { body.innerHTML = adminErr(error); return; }
  const k = (data && data.kpis) || {};
  const kp = $("supportKpis");
  if (kp) kp.innerHTML = statCard(k.waiting, "Waiting on us", 5) + statCard(k.answered, "Answered", 0) + statCard(k.resolved, "Resolved", 2) + statCard(k.new_24h, "New in 24h", 1) + statCard(k.total, "All tickets", 3);
  supportCache = (data && data.tickets) || [];
  if (!supportCache.length) { body.innerHTML = '<div class="empty"><div class="big">Nothing here</div>No tickets match this filter.</div>'; return; }
  body.innerHTML = '<div class="tscroll"><table class="data-table"><thead><tr><th>Status</th><th>Subject</th><th>From</th><th>Latest message</th><th class="num">Msgs</th><th>Updated</th></tr></thead><tbody>' +
    supportCache.map(ticketRow).join("") + '</tbody></table></div>';
  body.querySelectorAll(".ticketRow").forEach((r) => r.addEventListener("click", () => openTicket(r.dataset.id)));
}
function ticketPill(s) {
  if (s === "open") return '<span class="pill bad">waiting</span>';
  if (s === "answered") return '<span class="pill ok">answered</span>';
  if (s === "resolved") return '<span class="pill mut">resolved</span>';
  return '<span class="pill mut">' + esc(s || "unknown") + '</span>';
}
function ticketRow(t) {
  const who = t.last_sender === "support" ? "us" : "them";
  return '<tr class="ticketRow" data-id="' + t.id + '" style="cursor:pointer;">' +
    '<td>' + ticketPill(t.status) + '</td>' +
    '<td style="font-weight:600;">' + esc(t.subject || "No subject") + '</td>' +
    '<td>' + esc(t.person || "Unknown") + '</td>' +
    '<td style="color:var(--ink-soft);max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span class="pill mut" style="margin-right:6px;">' + who + '</span>' + esc(t.last_message || "") + '</td>' +
    '<td class="num">' + (t.msg_count || 0) + '</td>' +
    '<td style="color:var(--ink-soft);white-space:nowrap;">' + timeAgo(t.updated_at) + '</td></tr>';

async function openTicket(id, reason) {
  const w = $("drawer"), p = $("drawerPanel");
  w.classList.remove("hidden"); p.scrollTop = 0;
  p.innerHTML = '<button class="drawer-close" id="dcx">Close</button><div class="spin">Loading...</div>';
  $("dcx").addEventListener("click", closeDrawer);

  if (error) { p.innerHTML = '<button class="drawer-close" id="dcx2">Close</button>' + adminErr(error); $("dcx2").addEventListener("click", closeDrawer); return; }
  renderTicket(data || {}, { id: id, reason: reason });
}
function msgBubble(m) {
  const mine = m.sender === "support";
  const side = mine ? "margin-left:auto;background:var(--mint);" : "margin-right:auto;background:var(--surface-2);";
  const label = mine ? "Support" : "Them";
  const att = (m.attachment_urls && m.attachment_urls.length)
    ? '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;">' + m.attachment_urls.map((u) => '<a class="pill info" href="' + esc(u) + '" target="_blank" rel="noopener">attachment</a>').join("") + '</div>'
    : "";
  return '<div style="max-width:82%;' + side + 'border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:10px;">' +
    '<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);margin-bottom:3px;">' + label + ' &middot; ' + timeAgo(m.created_at) + '</div>' +
    '<div style="white-space:pre-wrap;">' + esc(m.body || "") + '</div>' + att + '</div>';
}
function renderTicket(d, ctx) {
  ctx = ctx || {};
  const t = d.ticket || {}, msgs = d.messages || [];
  const p = $("drawerPanel");
  const contact = [];
  if (d.reveal) {
    if (t.phone) contact.push(kv("Phone", esc(t.phone)));
    if (t.email) contact.push(kvRaw("Email", '<a class="maplink" href="mailto:' + esc(t.email) + '">' + esc(t.email) + '</a>'));
    if (t.current_tier) contact.push(kv("Tier", esc(t.current_tier)));
  }
  p.innerHTML =
    '<button class="drawer-close" id="dcx">Close</button>' +
    '<div class="d-head" style="margin-top:6px;"><div><div class="d-title" style="text-transform:none;">' + esc(t.subject || "Support ticket") + '</div>' +
    '<div class="d-sub">' + esc(t.person || "Unknown") + ' &middot; ' + ticketPill(t.status) + ' &middot; opened ' + timeAgo(t.created_at) + '</div></div></div>' +
    (needsReveal(ctx.reason) ? revealButtonHtml() : "") +
    (contact.length ? '<div class="card" style="margin-bottom:14px;"><h3>Contact</h3>' + contact.join("") + '</div>' : "") +
    '<div id="ticketThread" style="display:flex;flex-direction:column;margin-bottom:16px;max-height:46vh;overflow-y:auto;padding-right:2px;">' +
    (msgs.length ? msgs.map(msgBubble).join("") : '<div style="color:var(--ink-soft);">No messages.</div>') + '</div>' +
    '<div class="card"><h3>Reply</h3>' +
    '<textarea id="replyBody" class="search-input" style="width:100%;min-height:92px;resize:vertical;font-family:var(--ui);"' +
    ' placeholder="Write a reply. The person receives a notification in the app."></textarea>' +
    '<div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap;">' +
    '<button class="btn" id="replySend">Send reply</button>' +
    (t.status === "resolved" ? '<button class="btn-ghost" id="tkReopen">Reopen</button>' : '<button class="btn-ghost" id="tkResolve">Mark resolved</button>') +
    '<span class="grow"></span><span style="color:var(--ink-faint);font-size:12px;">Sent as FlagRisk Support.</span>' +
    '</div></div>';

async function sendReply(id, reason) {

async function setTicketStatus(id, status, reason) {

  if (error) { toast("Failed: " + error.message); return; }
  toast(status === "resolved" ? "Marked resolved" : "Reopened");

}

async function fetchLiveRates() {
  const urls = [
    "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json",
    "https://latest.currency-api.pages.dev/v1/currencies/usd.min.json",
    "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json",
    "https://latest.currency-api.pages.dev/v1/currencies/usd.json"
  ];
  for (const u of urls) {
    try { const r = await fetch(u); if (r.ok) { const j = await r.json(); if (j && j.usd) return j.usd; } } catch (e) {}
  }
  return null;
}
async function refreshRatesFromApi() {
  toast("Fetching live rates...");
  const usd = await fetchLiveRates();
  if (!usd) { toast("Could not reach the rates service"); return; }
  let n = 0;
  for (const c of CURRENCIES) {
    if (c.code === "USD") continue;
    const rate = usd[c.code.toLowerCase()];
    if (rate && rate > 0) {
      const { error } = await supabase.rpc("admin_set_currency_rate", { p_code: c.code, p_usd_rate: Math.round(rate * 10000) / 10000, p_default: null });
      if (!error) n++;
    }
  }
  logAccess("refresh_rates", "exchange-api", n + " updated");
  toast("Updated " + n + " rate" + (n === 1 ? "" : "s")); CURRENCIES = []; await loadCurrencies(); loadBilling();
}

// ---- Lawful disclosure export ----
async function runDisclosureExport() {
  if (!dxSubject) { toast("Select a subject first"); return; }
  const user = dxSubject.id;
  const reason = $("dxReason").value.trim();
  const from = $("dxFrom").value;
  const to = $("dxTo").value;
  const out = $("dxResult");

  if (reason.length < 8) { toast("A reason of at least 8 characters is required"); return; }
  if (!from || !to) { toast("Both a start and end date are required"); return; }

  const ok = window.confirm(
    "Export ALL records for:\n" + (dxSubject.name || "Unnamed") + " (" + (dxSubject.phone || "no phone") + ")" +
    "\n\nWindow: " + from + " to " + to +
    "\nReason: " + reason +
    "\n\nThis is a lawful-disclosure export and will be permanently logged against your account. Continue?"
  );
  if (!ok) return;

  out.innerHTML = '<div class="spin">Running export...</div>';
  const fromTs = new Date(from + "T00:00:00Z").toISOString();
  const toTs = new Date(to + "T23:59:59Z").toISOString();

  const { data, error } = await supabase.rpc("admin_disclosure_export", {
    p_user: user, p_reason: reason, p_from: fromTs, p_to: toTs,
  });
  if (error) { out.innerHTML = adminErr(error); return; }

  const counts = (data && data.record_counts) || {};
  const man = (data && data.manifest) || {};
  const cards = Object.entries(counts);

  out.innerHTML =
    '<div style="color:var(--ink-soft);font-size:12px;margin-bottom:10px;">Exported ' +
      esc(String(man.generated_at || "")) + ' &middot; window ' + esc(from) + ' to ' + esc(to) + '</div>' +
    '<div class="stat-grid">' + cards.map((c, i) =>
      '<div class="stat-card p' + (i % 6) + '"><div class="n">' + (c[1] == null ? 0 : c[1]) + '</div><div class="l">' +
      esc(c[0].replace(/_/g, " ")) + '</div></div>').join("") + '</div>' +
    '<button class="btn primary" id="dxDownload" style="margin-top:12px;">Download full JSON</button>' +
    '<div style="color:var(--ink-faint);font-size:12px;margin-top:10px;">The summary above shows record counts only. The downloaded file contains the full disclosure, including a manifest recording who ran it, on whom, under what reason, and over what window.</div>';

  $("dxDownload").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "flagrisk-disclosure-" + user.slice(0, 8) + "-" + from + "_to_" + to + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });

  logAccess("disclosure_export_downloaded", user, "window=" + from + ".." + to);
  toast("Export complete and logged");
}

// Group rows by tester, keeping each task's row for lookup.
function groupTesters(rows) {
  const by = {};
  rows.forEach((r) => {
    const k = r.tester_email || "unknown";
    if (!by[k]) by[k] = { name: r.tester_name, email: k, byTask: {}, answered: 0, pass: 0, partial: 0, fail: 0, last: null };
    const t = by[k];
    t.byTask[r.task_key] = r;
    if (r.tester_name) t.name = r.tester_name;
    if (r.result) t.answered++;
    if (r.result === "pass") t.pass++;
    else if (r.result === "partial") t.partial++;
    else if (r.result === "fail") t.fail++;
    if (!t.last || (r.updated_at && r.updated_at > t.last)) t.last = r.updated_at;
  });
  return by;
}

// Per-tester CSV: one row per task, in order.
function exportOneTester(t) {
  const rows = TEST_TASKS.map(([key, label], i) => {
    const r = t.byTask[key] || {};
    return { n: i + 1, task_key: key, task: label,
      result: RESULT_WORD[r.result] || "", note: r.friction_note || "", updated_at: r.updated_at || "" };
  });
  const safe = (t.name || t.email).replace(/[^a-z0-9]+/gi, "_").toLowerCase();
  exportCSV("flagrisk-tester-" + safe + ".csv", rows, [
    { key: "n", label: "#" }, { key: "task_key", label: "task_key" }, { key: "task", label: "task" },
    { key: "result", label: "result" }, { key: "note", label: "note" }, { key: "updated_at", label: "updated_at" },
  ]);
}

// Everyone CSV: one row per tester, two columns per task (result + note).
function exportEveryoneWide() {
  const by = groupTesters(testerRows);
  const testers = Object.values(by).sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));
  const cols = [{ key: "name", label: "tester" }, { key: "email", label: "email" },
                { key: "answered", label: "answered" }, { key: "last", label: "last_active" }];
  TEST_TASKS.forEach(([key, label]) => {
    cols.push({ key: key + "__result", label: label + " [result]" });
    cols.push({ key: key + "__note", label: label + " [note]" });
  });
  const rows = testers.map((t) => {
    const row = { name: t.name || "", email: t.email, answered: t.answered + "/" + TEST_TASK_TOTAL, last: t.last || "" };
    TEST_TASKS.forEach(([key]) => {
      const r = t.byTask[key] || {};
      row[key + "__result"] = RESULT_WORD[r.result] || "";
      row[key + "__note"] = r.friction_note || "";
    });
    return row;
  });
  exportCSV("flagrisk-all-testers.csv", rows, cols);
}

function exportAllInternalXlsx() {
  const btn = $("testXlsxAll");
  if (typeof XLSX === "undefined") { toast("Spreadsheet library not loaded. Hard refresh and try again."); return; }
  if (btn) { btn.disabled = true; btn.textContent = "Preparing..."; }
  try {
    const by = groupTesters(testerRows);
    const testers = Object.values(by).sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));
    const header = ["#", "task_key", "question", "response", "notes", "updated_at"];
    const widths = [{ wch: 4 }, { wch: 18 }, { wch: 44 }, { wch: 12 }, { wch: 60 }, { wch: 22 }];
    const wb = XLSX.utils.book_new();
    const used = {};
    testers.forEach((t) => {
      const rows = internalRowsForTester(t);
      const aoa = [["Tester", t.name || t.email], ["Email", t.email], [], header];
      rows.forEach((r) => aoa.push([r.n, r.task_key, r.task, r.result, r.note, r.updated_at]));
      const ws = XLSX.utils.aoa_to_sheet(aoa); ws["!cols"] = widths;
      let base = extSheetName(t.name || t.email), name = base, k = 2;
      while (used[name.toLowerCase()]) { name = base.slice(0, 28) + "_" + k; k++; }
      used[name.toLowerCase()] = 1;
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    if (!wb.SheetNames.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["No data yet"]]), "Empty");
    XLSX.writeFile(wb, "flagrisk-all-responses.xlsx");
    logAccess("export_internal_xlsx", null, testers.length + " sheets");
  } catch (e) { toast("Export failed: " + (e.message || e)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = "Export all responses (Excel)"; } }
}
async function exportInternalZip() {
  if (typeof JSZip === "undefined") { toast("ZIP library not loaded. Hard refresh and try again."); return; }
  const btn = $("testZipAll");
  if (btn) { btn.disabled = true; btn.textContent = "Building file..."; }
  try {
    const by = groupTesters(testerRows);
    const testers = Object.values(by).sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));
    const zip = new JSZip();
    const cell = (v) => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    const idx = [["tester", "email", "#", "task_key", "question", "response", "notes", "updated_at"]];
    testers.forEach((t) => {
      const rows = internalRowsForTester(t);
      const head = ["#", "task_key", "question", "response", "notes", "updated_at"];
      const body = rows.map((r) => [r.n, r.task_key, r.task, r.result, r.note, r.updated_at]);
      const csv = [head].concat(body).map((row) => row.map(cell).join(",")).join("\n");
      const folder = extFileSafe((t.name && t.name !== t.email) ? (t.name + " (" + t.email + ")") : t.email);
      zip.file(folder + "/responses.csv", csv);
      rows.forEach((r) => idx.push([t.name || "", t.email, r.n, r.task_key, r.task, r.result, r.note, r.updated_at]));
    });
    zip.file("index.csv", idx.map((row) => row.map(cell).join(",")).join("\n"));
    const blob = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "flagrisk-responses.zip"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    logAccess("export_internal_zip", null, testers.length + " testers");
    toast("The internal round has no screenshots, so the ZIP holds per-person response files.");
  } catch (e) { toast("ZIP build failed: " + (e.message || e)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = "Export responses (ZIP)"; } }
}

function resultPill(r) {
  if (r === "pass") return '<span class="pill ok">Worked</span>';
  if (r === "partial") return '<span class="pill" style="background:rgba(217,164,65,0.16);color:#d9a441;">Partly</span>';
  if (r === "fail") return '<span class="pill" style="background:rgba(217,87,87,0.16);color:#d95757;">Broke</span>';
  if (r === "skip") return '<span class="pill mut">Skipped</span>';
  return '<span class="pill mut">-</span>';
}

function fmtWhen(iso) {
  try {
    const d = new Date(iso), now = new Date();
    const mins = Math.round((now - d) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    if (mins < 1440) return Math.round(mins / 60) + "h ago";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  } catch (e) { return iso; }
}

let signupRows = [];
let signupKpis = {};
let signupStatus = "";
let signupSearch = "";
const SIGNUP_STATUSES = ["new", "invited", "active", "done", "declined"];

async function loadSignups() {
  const el = $("sec-signups");
  if (!signupRows.length) {
    el.innerHTML = '<div class="panel-head"><h1>Beta Tester (External)</h1><span class="sub">People who signed up on the public tester page</span></div><div class="spin">Loading...</div>';
  }
  try {
    const { data, error } = await supabase.rpc("admin_tester_signups", {
      p_status: signupStatus || null,
      p_search: signupSearch || null,
      p_limit: 500,
    });
    if (error) throw error;
    signupRows = (data && data.rows) || [];
    signupKpis = (data && data.kpis) || {};
  } catch (e) {
    el.innerHTML = '<div class="panel-head"><h1>Beta Tester (External)</h1></div>' + adminErr(e);
    return;
  }
  logAccess("view_signups", null, signupRows.length + " rows");
  renderSignups();
}

function signupPlatforms(p) {
  const arr = Array.isArray(p) ? p : [];
  if (!arr.length) return '<span class="pill mut">&mdash;</span>';
  return arr.map((x) => '<span class="pill ' + (x === "ios" ? "info" : "ok") + '">' + (x === "ios" ? "iPhone" : "Android") + '</span>').join(" ");
}

function renderSignups() {
  const el = $("sec-signups");
  const k = signupKpis || {};
  const canExport = !!(CAPS && CAPS.can_export);

  const stats = [
    [k.total || 0, "Signed up"],
    [k.new || 0, "Not contacted"],
    [k.invited || 0, "Invited"],
    [k.active || 0, "Testing"],
    [k.android || 0, "Android"],
    [k.ios || 0, "iPhone"],
  ];

  let html = '<div class="panel-head"><h1>Beta Tester (External)</h1><span class="sub">' +
    (k.new_24h || 0) + ' in the last 24 hours</span>' +
    (canExport ? '<button class="btn primary" id="suCsv" style="margin-left:auto;">Export (CSV)</button>' : '') +
    '</div>';

  html += '<div class="stat-grid">' + stats.map((s, i) =>
    '<div class="stat-card p' + (i % 6) + '"><div class="n">' + s[0] + '</div><div class="l">' + esc(s[1]) + '</div></div>').join("") + '</div>';

  html += '<div class="card" style="margin-top:18px;">' +
    '<div class="filter-bar" style="margin:0 0 12px;">' +
    '<input class="search-input" id="suSearch" placeholder="Search name, email or number, then Enter" value="' + esc(signupSearch) + '" style="min-width:240px;" />' +
    '<select class="search-input" id="suStatus"><option value="">Any status</option>' +
    SIGNUP_STATUSES.map((s) => '<option value="' + s + '"' + (signupStatus === s ? " selected" : "") + '>' + s + '</option>').join("") +
    '</select></div>';

  if (!signupRows.length) {
    html += '<div class="empty"><div class="big">No signups</div>Nobody matches this filter yet.</div></div>';
    el.innerHTML = html;
    wireSignupFilters();
    return;
  }

  html += '<div class="tscroll"><table class="data-table"><thead><tr>' +
    '<th>Name</th><th>WhatsApp</th><th>Email</th><th>Phone</th><th>Status</th><th>Note</th><th>Signed up</th>' +
    '</tr></thead><tbody>' +
    signupRows.map((r) => {
      const wa = String(r.whatsapp || "").replace(/[^0-9]/g, "");
      return '<tr>' +
        '<td style="font-weight:600;">' + esc(((r.first_name || "") + " " + (r.last_name || "")).trim() || "&mdash;") + '</td>' +
        '<td class="mono" style="font-size:12px;"><a href="https://wa.me/' + wa + '" target="_blank" rel="noopener" style="color:var(--green);">' + esc(r.whatsapp || "&mdash;") + '</a></td>' +
        '<td class="mono" style="font-size:12px;"><a href="mailto:' + esc(r.email || "") + '" style="color:inherit;">' + esc(r.email || "&mdash;") + '</a></td>' +
        '<td>' + signupPlatforms(r.platforms) + '</td>' +
        '<td><select class="search-input suSel" data-id="' + esc(r.id) + '" style="min-width:110px;">' +
          SIGNUP_STATUSES.map((s) => '<option value="' + s + '"' + (r.status === s ? " selected" : "") + '>' + s + '</option>').join("") +
        '</select></td>' +
        '<td style="color:var(--ink-soft);max-width:220px;">' +
          '<button class="btn suNote" data-id="' + esc(r.id) + '" style="margin-right:6px;">Edit</button>' +
          esc(r.admin_notes || "") + '</td>' +
        '<td style="font-size:12px;color:var(--ink-soft);white-space:nowrap;">' + timeAgo(r.created_at) + '</td>' +

    }).join("") +
    '</tbody></table></div></div>';

  el.innerHTML = html;

  el.querySelectorAll(".suSel").forEach((sel) =>
    sel.addEventListener("change", () => setSignup(sel.dataset.id, sel.value, null)));
  el.querySelectorAll(".suNote").forEach((b) =>
    b.addEventListener("click", () => {
      const row = signupRows.find((x) => x.id === b.dataset.id) || {};
      const note = prompt("Note for this tester:", row.admin_notes || "");
      if (note === null) return;
      setSignup(b.dataset.id, null, note);
    }));

  if (canExport) $("suCsv").addEventListener("click", exportSignups);
}

function wireSignupFilters() {
  const s = $("suSearch"), f = $("suStatus");
  if (s) s.addEventListener("keydown", (e) => { if (e.key === "Enter") { signupSearch = s.value.trim(); loadSignups(); } });
  if (f) f.addEventListener("change", () => { signupStatus = f.value; loadSignups(); });
}

async function setSignup(id, status, note) {
  const { error } = await supabase.rpc("admin_tester_signup_update", {
    p_id: id, p_status: status, p_note: note,
  });
  if (error) { toast("Update failed: " + error.message); return; }
  logAccess("signup_update", id, status || "note");
  toast(status ? "Marked " + status : "Note saved");
  loadSignups();
}

function exportSignups() {
  const rows = signupRows.map((r) => ({
    first_name: r.first_name, last_name: r.last_name, whatsapp: r.whatsapp, email: r.email,
    platforms: (Array.isArray(r.platforms) ? r.platforms : []).join(" "),
    status: r.status, note: r.admin_notes || "", signed_up: r.created_at,
  }));
  exportCSV("flagrisk-tester-signups.csv", rows, [
    { key: "first_name", label: "first_name" }, { key: "last_name", label: "last_name" },
    { key: "whatsapp", label: "whatsapp" }, { key: "email", label: "email" },
    { key: "platforms", label: "platforms" }, { key: "status", label: "status" },
    { key: "note", label: "note" }, { key: "signed_up", label: "signed_up" },
  ]);
}

// Dimension-aware result pill.
function extPill(dim, r) {
  const L = dim === "visuals"
    ? { pass: "Looks right", partial: "Off", fail: "Broken" }
    : { pass: "Worked", partial: "Partly", fail: "Broke" };
  if (r === "pass") return '<span class="pill ok">' + L.pass + '</span>';
  if (r === "partial") return '<span class="pill" style="background:rgba(217,164,65,0.16);color:#d9a441;">' + L.partial + '</span>';
  if (r === "fail") return '<span class="pill" style="background:rgba(217,87,87,0.16);color:#d95757;">' + L.fail + '</span>';
  return '<span class="pill mut">-</span>';
}
const EXT_WORD = {
  functionality: { pass: "Worked", partial: "Partly", fail: "Broke" },
  visuals: { pass: "Looks right", partial: "Off", fail: "Broken" },
};

let testerRowsExt = [];
let testerMediaExt = {};   // "email||task_key" -> [path]
let testerMediaMeta = {};  // email -> { count, last }
let testerViewExt = null;

// Merge feedback-derived testers with anyone who has only uploaded screenshots,
// so media-only testers still appear and their shots stay reachable.
function mergedTestersExt() {
  const by = groupTestersExt(testerRowsExt);
  Object.keys(testerMediaMeta).forEach((email) => {
    if (!by[email]) {
      by[email] = { name: email, email: email, byTask: {},
        fn: { answered: 0, pass: 0, partial: 0, fail: 0 },
        vis: { answered: 0, pass: 0, partial: 0, fail: 0 },
        last: testerMediaMeta[email].last };
    } else if (!by[email].last && testerMediaMeta[email].last) {
      by[email].last = testerMediaMeta[email].last;
    }
  });
  return by;
}

async function loadTestingExt() {
  const el = $("sec-testingext");
  el.innerHTML = '<div class="panel-head"><h1>Beta testing (External)</h1><span class="sub">Feedback from the external tester workbook</span></div><div class="spin">Loading...</div>';
  let rows = [];
  try {
    const { data, error } = await supabase.rpc("admin_tester_feedback_ext");
    if (error) throw error;
    rows = data || [];
  } catch (e) {
    el.innerHTML = '<div class="panel-head"><h1>Beta testing (External)</h1></div><div class="empty"><div class="big">Could not load feedback</div>' + esc(e.message || String(e)) + '</div>';
    return;
  }
  testerRowsExt = rows;
  testerMediaExt = {};
  testerMediaMeta = {};
  try {
    const { data: m } = await supabase.rpc("admin_tester_media_ext");
    (m || []).forEach((row) => {
      const email = row.tester_email || "";
      const k = email + "||" + (row.task_key || "");
      (testerMediaExt[k] = testerMediaExt[k] || []).push(row.path);
      const meta = testerMediaMeta[email] = testerMediaMeta[email] || { count: 0, last: null };
      meta.count++;
      if (row.created_at && (!meta.last || row.created_at > meta.last)) meta.last = row.created_at;
    });
  } catch (e) { /* media is optional; ignore if RPC missing */ }
  if (testerViewExt && !rows.some((r) => r.tester_email === testerViewExt)) testerViewExt = null;
  renderTestingExt();
}

// Group by tester, tracking each dimension separately.
function groupTestersExt(rows) {
  const by = {};
  rows.forEach((r) => {
    const k = r.tester_email || "unknown";
    if (!by[k]) by[k] = { name: r.tester_name, email: k, byTask: {},
      fn: { answered: 0, pass: 0, partial: 0, fail: 0 },
      vis: { answered: 0, pass: 0, partial: 0, fail: 0 }, last: null };
    const t = by[k];
    t.byTask[r.task_key] = r;
    if (r.tester_name) t.name = r.tester_name;
    const bucket = (r.dimension === "visuals") ? t.vis : t.fn;
    if (r.result) bucket.answered++;
    if (r.result === "pass") bucket.pass++;
    else if (r.result === "partial") bucket.partial++;
    else if (r.result === "fail") bucket.fail++;
    if (!t.last || (r.updated_at && r.updated_at > t.last)) t.last = r.updated_at;
  });
  return by;
}

function renderTestingExt() {
  if (testerViewExt) return renderTesterDetailExt(testerViewExt);

  const rows = testerRowsExt;
  const by = mergedTestersExt();

  html += '<div class="card" style="margin-top:18px;"><h3>Testers</h3>';
  if (!testers.length) {
    html += '<div class="empty"><div class="big">No feedback yet</div>Once external testers begin the workbook, they appear here.</div>';
  } else {
    html += '<table class="data-table"><thead><tr><th>Tester</th><th>Email</th><th class="num">Functionality</th><th class="num">Visuals</th><th class="num">Shots</th><th>Last active</th></tr></thead><tbody>' +

        let sc = 0;
        Object.keys(testerMediaExt).forEach((k) => { if (k.indexOf(t.email + "||") === 0) sc += testerMediaExt[k].length; });

          '<td style="font-size:12px;color:var(--ink-soft);">' + (t.last ? fmtWhen(t.last) : "-") + '</td></tr>';
      }).join("") +
      '</tbody></table>';
  }
  html += '</div>';
  el.innerHTML = html;

  el.querySelectorAll("tr.clickable").forEach((tr) =>
    tr.addEventListener("click", () => { testerViewExt = tr.dataset.email; renderTestingExt(); }));
  if (canExport) { $("testCsvAllExt").addEventListener("click", exportAllResponsesCsvExt); $("testXlsxAllExt").addEventListener("click", exportAllResponsesExt); $("testZipExt").addEventListener("click", exportShotsZipExt); }
}

function extSectionHtml(t, dim, tasks) {
  let html = '<div class="card" style="margin-top:18px;"><h3>' + (dim === "visuals" ? "Visuals" : "Functionality") + '</h3>';
  html += '<table class="data-table"><thead><tr><th style="width:34px;">#</th><th>Task</th><th>Result</th><th>Note</th><th>Shots</th><th>When</th></tr></thead><tbody>';
  tasks.forEach(([key, label], i) => {
    const r = t.byTask[key];
    const answered = r && r.result;
    const mkey = t.email + "||" + key;
    const paths = testerMediaExt[mkey] || [];
    const shotCell = paths.length
      ? '<button class="btn extShots" data-key="' + esc(mkey) + '">' + paths.length + '</button>'
      : '<span style="color:var(--ink-faint);">-</span>';
    html += '<tr' + (answered ? '' : ' style="opacity:0.55;"') + '>' +
      '<td class="num" style="color:var(--ink-faint);">' + (i + 1) + '</td>' +
      '<td style="font-weight:600;">' + esc(label) + '</td>' +
      '<td>' + (r ? extPill(dim, r.result) : '<span class="pill mut">-</span>') + '</td>' +
      '<td style="color:var(--ink-soft);min-width:260px;">' + esc((r && r.friction_note) || "") + '</td>' +
      '<td>' + shotCell + '</td>' +
      '<td style="font-size:12px;color:var(--ink-faint);white-space:nowrap;">' + (r && r.updated_at ? fmtWhen(r.updated_at) : "") + '</td></tr>' +
      '<tr id="shotrow-' + esc(key) + '" class="hidden"><td colspan="6" id="shotcell-' + esc(key) + '" style="background:var(--surface-2);"></td></tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function renderTesterDetailExt(email) {
  const el = $("sec-testingext");
  const by = mergedTestersExt();
  const t = by[email];
  if (!t) { testerViewExt = null; return renderTestingExt(); }
  const canExport = !!(CAPS && CAPS.can_export);

  let html = '<div class="panel-head">' +
    '<button class="btn" id="testBackExt" style="margin-right:12px;">&larr; All testers</button>' +

  const stats = [
    [t.fn.answered + " / " + EXT_FN_TOTAL, "Functionality"],
    [t.vis.answered + " / " + EXT_VIS_TOTAL, "Visuals"],
    [(t.fn.fail + t.vis.fail) || 0, "Broke / Broken"],

    '<div class="stat-card p' + (i % 6) + '"><div class="n">' + s[0] + '</div><div class="l">' + esc(s[1]) + '</div></div>').join("") + '</div>';

  html += extSectionHtml(t, "functionality", EXT_FN_TASKS);
  html += extSectionHtml(t, "visuals", EXT_VIS_TASKS);
  el.innerHTML = html;

  $("testBackExt").addEventListener("click", () => { testerViewExt = null; renderTestingExt(); });
  if (canExport) $("testCsvOneExt").addEventListener("click", () => exportOneTesterExt(t));
  el.querySelectorAll(".extShots").forEach((b) => b.addEventListener("click", () => toggleExtShots(b.dataset.key)));
}

async function toggleExtShots(mkey) {
  const key = mkey.split("||")[1];
  const row = $("shotrow-" + key), cell = $("shotcell-" + key);
  if (!row || !cell) return;
  if (!row.classList.contains("hidden")) { row.classList.add("hidden"); return; }
  row.classList.remove("hidden");
  cell.innerHTML = '<div class="spin" style="padding:10px;">Loading screenshots...</div>';
  const paths = testerMediaExt[mkey] || [];
  const imgs = [];
  for (const p of paths) {
    try {
      const { data } = await supabase.storage.from(EXT_BUCKET).createSignedUrl(p, 600);
      if (data && data.signedUrl) imgs.push(data.signedUrl);
    } catch (e) { /* skip a broken path */ }
  }
  logAccess("view_tester_shots", mkey, paths.length + " images");
  cell.innerHTML = imgs.length
    ? '<div style="display:flex;flex-wrap:wrap;gap:10px;padding:10px 0;">' +
        imgs.map((u) => '<a href="' + u + '" target="_blank" rel="noopener"><img src="' + u + '" style="width:150px;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--line);" /></a>').join("") +
      '</div>'
    : '<div style="color:var(--ink-soft);padding:10px 0;">Could not load images.</div>';
}


// ---- Screenshot export helpers ----
const EXT_SIGN_TTL = 60 * 60 * 24 * 365; // 1 year; long enough that exported links keep working
const EXT_MAX_SHOTS_COL = 4;

// Canonical position/label for a task key, for stable ordering and folder names.
const EXT_TASK_INDEX = (() => {
  const idx = {};
  EXT_FN_TASKS.forEach(([key, label], i) => { idx[key] = { tab: "Functionality", letter: "F", ord: i + 1, label }; });
  EXT_VIS_TASKS.forEach(([key, label], i) => { idx[key] = { tab: "Visuals", letter: "V", ord: i + 1, label }; });
  return idx;
})();

function extFileSafe(s) {
  return String(s == null ? "" : s).replace(/[^a-zA-Z0-9._ -]+/g, "_").replace(/\s+/g, " ").trim().replace(/^[. ]+|[. ]+$/g, "").slice(0, 60) || "x";
}
function extPathExt(p) { const m = String(p || "").match(/\.([a-z0-9]{2,5})(?:\?|$)/i); return m ? m[1].toLowerCase() : "png"; }

// Batch-sign a list of storage paths into a { path: url } map. URLs open for anyone holding them.
async function extSignedMap(paths) {
  const map = {};
  const uniq = Array.from(new Set(paths.filter(Boolean)));
  for (let i = 0; i < uniq.length; i += 100) {
    const chunk = uniq.slice(i, i + 100);
    try {
      const { data } = await supabase.storage.from(EXT_BUCKET).createSignedUrls(chunk, EXT_SIGN_TTL);
      (data || []).forEach((d) => { if (d && d.path && d.signedUrl) map[d.path] = d.signedUrl; });
    } catch (e) {
      for (const p of chunk) {
        try { const { data } = await supabase.storage.from(EXT_BUCKET).createSignedUrl(p, EXT_SIGN_TTL); if (data && data.signedUrl) map[p] = data.signedUrl; } catch (_) {}
      }
    }
  }
  return map;
}

// Long-format columns shared by both CSV exports: one row per (tester, task).
function extCsvCols() {
  const cols = [
    { key: "tester", label: "tester" }, { key: "email", label: "email" },
    { key: "tab", label: "tab" }, { key: "n", label: "#" },
    { key: "task_key", label: "task_key" }, { key: "task", label: "question" },
    { key: "result", label: "response" }, { key: "note", label: "notes" },
    { key: "shot_count", label: "screenshot_count" },
  ];
  for (let i = 1; i <= EXT_MAX_SHOTS_COL; i++) cols.push({ key: "shot_" + i, label: "screenshot_" + i + "_url" });
  cols.push({ key: "updated_at", label: "updated_at" });
  return cols;
}
function extCsvRowsForTester(t, signed) {
  const out = [];
  const build = (dim, tasks) => tasks.forEach(([key, label], i) => {
    const r = t.byTask[key] || {};
    const paths = testerMediaExt[t.email + "||" + key] || [];
    const row = {
      tester: t.name || t.email, email: t.email,
      tab: dim === "visuals" ? "Visuals" : "Functionality", n: i + 1,
      task_key: key, task: label, result: EXT_WORD[dim][r.result] || "",
      note: r.friction_note || "", shot_count: paths.length,
      updated_at: r.updated_at || "",
    };
    for (let s = 0; s < EXT_MAX_SHOTS_COL; s++) row["shot_" + (s + 1)] = paths[s] ? (signed[paths[s]] || "") : "";
    out.push(row);
  });
  build("functionality", EXT_FN_TASKS);
  build("visuals", EXT_VIS_TASKS);
  return out;
}

async function exportOneTesterExt(t) {
  const btnBusy = $("testCsvOneExt");
  if (btnBusy) { btnBusy.disabled = true; btnBusy.textContent = "Preparing..."; }
  try {
    const paths = [];
    Object.keys(testerMediaExt).forEach((k) => { if (k.indexOf(t.email + "||") === 0) paths.push.apply(paths, testerMediaExt[k]); });
    const signed = await extSignedMap(paths);
    const rows = extCsvRowsForTester(t, signed);
    const safe = extFileSafe(t.name || t.email).replace(/ /g, "_").toLowerCase();
    exportCSV("flagrisk-ext-tester-" + safe + ".csv", rows, extCsvCols());
    logAccess("export_tester_csv", t.email, rows.length + " rows");
  } catch (e) { toast("Export failed: " + (e.message || e)); }
  finally { if (btnBusy) { btnBusy.disabled = false; btnBusy.textContent = "Export this tester (CSV)"; } }
}

// Excel sheet name: <=31 chars, none of [ ] : * ? / \, unique per workbook.
function extSheetName(s) {
  let n = String(s == null ? "" : s).replace(/[\[\]:*?\/\\]/g, "_").replace(/^'+|'+$/g, "").trim();
  return (n || "Tester").slice(0, 31);
}

async function exportAllResponsesCsvExt() {
  const btnBusy = $("testCsvAllExt");
  if (btnBusy) { btnBusy.disabled = true; btnBusy.textContent = "Preparing..."; }
  try {
    const by = mergedTestersExt();
    const testers = Object.values(by).sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));
    const allPaths = [];
    Object.keys(testerMediaExt).forEach((k) => allPaths.push.apply(allPaths, testerMediaExt[k]));
    const signed = await extSignedMap(allPaths);
    let rows = [];
    testers.forEach((t) => { rows = rows.concat(extCsvRowsForTester(t, signed)); });
    exportCSV("flagrisk-ext-all-responses.csv", rows, extCsvCols());
    logAccess("export_all_csv", null, rows.length + " rows");
  } catch (e) { toast("Export failed: " + (e.message || e)); }
  finally { if (btnBusy) { btnBusy.disabled = false; btnBusy.textContent = "Export all responses (CSV)"; } }
}

async function exportAllResponsesExt() {
  const btnBusy = $("testXlsxAllExt");
  if (typeof XLSX === "undefined") { toast("Spreadsheet library not loaded. Hard refresh and try again."); return; }
  if (btnBusy) { btnBusy.disabled = true; btnBusy.textContent = "Preparing..."; }
  try {
    const by = mergedTestersExt();
    const testers = Object.values(by).sort((a, b) => (a.name || a.email).localeCompare(b.name || b.email));
    const allPaths = [];
    Object.keys(testerMediaExt).forEach((k) => allPaths.push.apply(allPaths, testerMediaExt[k]));
    const signed = await extSignedMap(allPaths);

    const header = ["tab", "#", "task_key", "question", "response", "notes", "screenshot_count",
      "screenshot_1_url", "screenshot_2_url", "screenshot_3_url", "screenshot_4_url", "updated_at"];
    const shotMap = [["shot_1", 7], ["shot_2", 8], ["shot_3", 9], ["shot_4", 10]];
    const widths = [{ wch: 14 }, { wch: 4 }, { wch: 18 }, { wch: 42 }, { wch: 12 }, { wch: 50 },
      { wch: 7 }, { wch: 46 }, { wch: 46 }, { wch: 46 }, { wch: 46 }, { wch: 22 }];

    const wb = XLSX.utils.book_new();
    const used = {};
    testers.forEach((t) => {
      const rows = extCsvRowsForTester(t, signed);
      const aoa = [["Tester", t.name || t.email], ["Email", t.email], [], header];
      rows.forEach((r) => aoa.push([r.tab, r.n, r.task_key, r.task, r.result, r.note, r.shot_count,
        r.shot_1 || "", r.shot_2 || "", r.shot_3 || "", r.shot_4 || "", r.updated_at]));
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      // Make each screenshot URL a clickable hyperlink. Data starts at sheet row index 4.
      rows.forEach((r, i) => {
        shotMap.forEach(([key, c]) => {
          const url = r[key];
          if (!url) return;
          const ref = XLSX.utils.encode_cell({ r: 4 + i, c: c });
          if (ws[ref]) ws[ref].l = { Target: url, Tooltip: "Open screenshot" };
        });
      });
      ws["!cols"] = widths;

      let base = extSheetName(t.name || t.email), name = base, k = 2;
      while (used[name.toLowerCase()]) { name = base.slice(0, 28) + "_" + k; k++; }
      used[name.toLowerCase()] = 1;
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    if (!wb.SheetNames.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["No data yet"]]), "Empty");

    XLSX.writeFile(wb, "flagrisk-ext-all-responses.xlsx");
    logAccess("export_all_xlsx", null, testers.length + " sheets");
  } catch (e) { toast("Export failed: " + (e.message || e)); }
  finally { if (btnBusy) { btnBusy.disabled = false; btnBusy.textContent = "Export all responses (Excel)"; } }
}

// ---- ZIP of every screenshot, foldered by person then by question ----
async function exportShotsZipExt() {
  if (typeof JSZip === "undefined") { toast("ZIP library not loaded. Hard refresh and try again."); return; }
  const btn = $("testZipExt");
  const total = Object.values(testerMediaExt).reduce((n, a) => n + a.length, 0);
  if (!total) { toast("No screenshots to export yet."); return; }
  if (btn) { btn.disabled = true; btn.textContent = "Zipping 0 / " + total; }

  const by = mergedTestersExt();
  const nameFor = (email) => { const t = by[email]; const nm = t && t.name && t.name !== email ? t.name : null; return nm ? extFileSafe(nm) + " (" + extFileSafe(email) + ")" : extFileSafe(email); };

  // Sign everything first.
  const allPaths = [];
  Object.keys(testerMediaExt).forEach((k) => allPaths.push.apply(allPaths, testerMediaExt[k]));
  const signed = await extSignedMap(allPaths);

  const zip = new JSZip();
  let done = 0, failed = 0;
  const manifest = [["tester", "email", "tab", "question", "task_key", "file", "url"]];

  // Iterate people, then that person's tasks in canonical order.
  const emails = Object.keys(by).sort((a, b) => (by[a].name || a).localeCompare(by[b].name || b));
  for (const email of emails) {
    const personFolder = nameFor(email);
    const orderedKeys = EXT_FN_TASKS.map((x) => x[0]).concat(EXT_VIS_TASKS.map((x) => x[0]));
    for (const key of orderedKeys) {
      const paths = testerMediaExt[email + "||" + key] || [];
      if (!paths.length) continue;
      const meta = EXT_TASK_INDEX[key] || { letter: "X", ord: 0, label: key, tab: "" };
      const qFolder = meta.letter + String(meta.ord).padStart(2, "0") + "_" + extFileSafe(meta.label).replace(/ /g, "_");
      for (let i = 0; i < paths.length; i++) {
        const p = paths[i];
        const url = signed[p];
        const fname = String(i + 1).padStart(2, "0") + "." + extPathExt(p);
        const full = personFolder + "/" + qFolder + "/" + fname;
        manifest.push([by[email].name || "", email, meta.tab, meta.label, key, full, url || ""]);
        try {
          if (!url) throw new Error("no url");
          const resp = await fetch(url);
          if (!resp.ok) throw new Error("http " + resp.status);
          zip.file(full, await resp.blob());
        } catch (e) { failed++; }
        done++;
        if (btn) btn.textContent = "Zipping " + done + " / " + total;
      }
    }
  }

  // Manifest CSV inside the zip, linking every file to its person, question and URL.
  const cell = (v) => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  zip.file("index.csv", manifest.map((r) => r.map(cell).join(",")).join("\n"));

  if (btn) btn.textContent = "Building file...";
  try {
    const blob = await zip.generateAsync({ type: "blob" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "flagrisk-ext-screenshots.zip"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    logAccess("export_shots_zip", null, done + " files, " + failed + " failed");
    if (failed) toast(failed + " image(s) could not be fetched and were listed in index.csv only.");
  } catch (e) { toast("ZIP build failed: " + (e.message || e)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = "Export screenshots (ZIP)"; } }
}
